name: raspis-unos

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: timetable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetable -d timetable"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TIMETABLE_HOST: 0.0.0.0
      TIMETABLE_DATABASE_URL: host=db port=5432 dbname=timetable user=timetable password=${POSTGRES_PASSWORD} connect_timeout=5
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../data:/app/data
      - ../output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/auth/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: timetable
      PGUSER: timetable
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: 210
    volumes:
      - ./backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/bash", "/usr/local/bin/backup-postgres.sh"]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
